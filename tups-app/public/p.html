<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUPS Preset</title>

  <!-- Rich link preview (WhatsApp, iMessage, Telegram...) -->
  <meta property="og:title" content="TUPS Rhythm Preset 🎵">
  <meta property="og:description" content="Someone shared a rhythm preset with you. Tap to open it in the TUPS app.">
  <meta property="og:image" content="https://www.tupstheapp.com/logo.png">
  <meta property="og:url" content="https://www.tupstheapp.com/p">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#0d0d12">
  <meta name="robots" content="noindex">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d0d12;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card { max-width: 360px; width: 100%; text-align: center; }
    .logo { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .preset-name {
      color: #7dd3fc;
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 6px;
      word-break: break-word;
    }
    .sub { color: #9ca3af; font-size: 14px; line-height: 1.5; margin-bottom: 28px; }
    .open-btn {
      display: block;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      padding: 15px 24px;
      border-radius: 14px;
      margin-bottom: 24px;
    }
    .divider { color: #4b5563; font-size: 13px; margin-bottom: 16px; }
    .stores { display: flex; gap: 12px; justify-content: center; }
    .store-btn {
      flex: 1;
      display: block;
      background: #1f2937;
      border: 1px solid #374151;
      color: #e5e7eb;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 8px;
      border-radius: 12px;
    }
    .store-btn small { display: block; color: #9ca3af; font-weight: 400; font-size: 11px; }
    .hint { color: #6b7280; font-size: 12px; margin-top: 24px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/logo.png" alt="TUPS">
    <h1>Rhythm Preset</h1>
    <div class="preset-name" id="presetName"></div>
    <p class="sub">This preset opens in the <strong>TUPS</strong> rhythm training app.</p>

    <a class="open-btn" id="openBtn" href="#">Open in TUPS</a>

    <div class="divider">Don't have the app yet?</div>
    <div class="stores">
      <a class="store-btn" href="https://apps.apple.com/app/tups-pro/id6752381668">
        App&nbsp;Store <small>iPhone</small>
      </a>
      <a class="store-btn" href="https://play.google.com/store/apps/details?id=com.tups.app">
        Google&nbsp;Play <small>Android</small>
      </a>
    </div>

    <p class="hint">Already installed? Install first, then come back and tap the shared link again — it will open directly in the app.</p>
  </div>

  <script>
    // Preset data lives in the URL fragment (#d=...) — it never reaches the
    // server. If the OS didn't route this link into the app (app missing, or
    // user opened it in a browser), offer the legacy tups:// scheme as a
    // manual "Open in TUPS" fallback and show the preset name.
    (function () {
      var hash = window.location.hash.replace(/^#/, '');
      var params = new URLSearchParams(hash);
      var d = params.get('d');
      if (!d) return;

      document.getElementById('openBtn').href = 'tups://import?d=' + d;

      // Payload may be gzipped (new app versions) or plain JSON (old ones);
      // gzip magic bytes 1f 8b tell them apart. Preview is optional — the
      // button works either way.
      (async function () {
        try {
          var b64 = d.replace(/-/g, '+').replace(/_/g, '/');
          var bin = atob(b64);
          var bytes = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

          var text;
          if (bytes[0] === 0x1f && bytes[1] === 0x8b) {
            var stream = new Blob([bytes]).stream()
              .pipeThrough(new DecompressionStream('gzip'));
            text = await new Response(stream).text();
          } else {
            text = new TextDecoder().decode(bytes);
          }

          var presets = JSON.parse(text).presets || [];
          if (presets.length === 1 && presets[0].name) {
            document.getElementById('presetName').textContent = '“' + presets[0].name + '”';
          } else if (presets.length > 1) {
            document.getElementById('presetName').textContent = presets.length + ' presets';
          }
        } catch (e) { /* ignore */ }
      })();
    })();
  </script>
</body>
</html>
