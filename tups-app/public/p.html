<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tups Preset</title>

  <!-- Rich link preview (WhatsApp, iMessage, Telegram...) -->
  <meta property="og:title" content="Tups Rhythm Preset">
  <meta property="og:description" content="Someone shared a rhythm preset with you. Tap to open it in Tups.">
  <meta property="og:image" content="https://www.tupstheapp.com/logo.png">
  <meta property="og:url" content="https://www.tupstheapp.com/p">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#07080c">
  <meta name="robots" content="noindex">
  <link rel="icon" href="img/favicon.png">
  <link rel="stylesheet" href="site.css">

  <style>
    .page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { max-width: 380px; width: 100%; text-align: center; }
    .logo { width: 76px; height: 76px; padding: 14px; border-radius: 20px; background: #2b2b2b; color: #fff; margin: 0 auto 26px; display: block; }
    .eyebrow { margin-bottom: 14px; }
    h1 { font: 300 34px/1.05 var(--display); margin: 0 0 10px; }
    h1 b { font-weight: 600; }
    .preset-name { font: 400 20px/1.3 var(--display); color: var(--teal); margin-bottom: 8px; word-break: break-word; min-height: 0; }
    .sub { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0 0 28px; }
    .page .open-btn {
      display: flex; align-items: center; justify-content: center;
      height: 54px; border-radius: 14px;
      background: #e9e9ee; color: #0a0b0f; text-decoration: none;
      font: 500 17px/1 var(--body);
      margin-bottom: 30px;
    }
    .page .open-btn:hover { background: #fff; }
    .divider { color: var(--faint); font: 500 11px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; margin-bottom: 16px; }
    .stores { display: flex; gap: 10px; justify-content: center; }
    .stores a { display: block; height: 44px; }
    .stores img { height: 100%; width: auto; }
    .hint { color: var(--faint); font-size: 13px; margin-top: 26px; line-height: 1.55; }
  </style>
</head>
<body class="page">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="mark" viewBox="125 130 773 764"><rect x="125" y="130" width="773" height="246" rx="34" fill="currentColor"/><rect x="125" y="389" width="254" height="245" rx="32" fill="currentColor" opacity=".32"/><rect x="389" y="389" width="249" height="245" rx="32" fill="currentColor"/><rect x="648" y="389" width="250" height="245" rx="32" fill="currentColor" opacity=".32"/><rect x="125" y="648" width="122" height="246" rx="28" fill="currentColor" opacity=".32"/><rect x="257" y="648" width="122" height="246" rx="28" fill="currentColor" opacity=".32"/><rect x="389" y="648" width="119" height="246" rx="28" fill="currentColor"/><rect x="517" y="648" width="121" height="246" rx="28" fill="currentColor"/><rect x="648" y="648" width="119" height="246" rx="28" fill="currentColor" opacity=".32"/><rect x="777" y="648" width="121" height="246" rx="28" fill="currentColor" opacity=".32"/></symbol></defs></svg>
  <div class="card">
    <svg class="logo" aria-label="Tups"><use href="#mark"/></svg>
    <div class="eyebrow">Shared with you</div>
    <h1>Rhythm <b>Preset</b></h1>
    <div class="preset-name" id="presetName"></div>
    <p class="sub">This preset opens in Tups, the rhythm lab &amp; metronome.</p>

    <a class="open-btn" id="openBtn" href="#">Open in Tups</a>

    <div class="divider">Don't have Tups yet?</div>
    <div class="stores">
      <a href="https://apps.apple.com/app/tups-pro/id6752381668"><img src="img/app-store.svg" alt="Download on the App Store"></a>
      <a href="https://play.google.com/store/apps/details?id=com.tups.app"><img src="img/google-play.png" alt="Get it on Google Play"></a>
    </div>

    <p class="hint">Install Tups, then come back and tap the shared link again. It will open directly in the app.</p>
  </div>

  <script>
    // Preset data lives in the URL fragment (#d=...) — it never reaches the
    // server. If the OS didn't route this link into the app (app missing, or
    // user opened it in a browser), offer the legacy tups:// scheme as a
    // manual "Open in TUPS" fallback and show the preset name.
    (function () {
      var hash = window.location.hash.replace(/^#/, '');
      var params = new URLSearchParams(hash);
      var d = params.get('d');
      if (!d) return;

      document.getElementById('openBtn').href = 'tups://import?d=' + d;

      // Payload may be gzipped (new app versions) or plain JSON (old ones);
      // gzip magic bytes 1f 8b tell them apart. Preview is optional — the
      // button works either way.
      (async function () {
        try {
          var b64 = d.replace(/-/g, '+').replace(/_/g, '/');
          var bin = atob(b64);
          var bytes = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

          var text;
          if (bytes[0] === 0x1f && bytes[1] === 0x8b) {
            var stream = new Blob([bytes]).stream()
              .pipeThrough(new DecompressionStream('gzip'));
            text = await new Response(stream).text();
          } else {
            text = new TextDecoder().decode(bytes);
          }

          var presets = JSON.parse(text).presets || [];
          if (presets.length === 1 && presets[0].name) {
            document.getElementById('presetName').textContent = '“' + presets[0].name + '”';
          } else if (presets.length > 1) {
            document.getElementById('presetName').textContent = presets.length + ' presets';
          }
        } catch (e) { /* ignore */ }
      })();
    })();
  </script>
</body>
</html>
